<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHANGE · 物料定制</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Syne:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/page/assets/custom.css" />
  </head>
  <body class="custom-body">
    <div class="custom-layout">
      <aside class="custom-side">
        <div class="custom-brand">Chan<span>ge</span></div>
        <nav class="custom-nav" id="custom-nav">
          <button type="button" data-nav="products" class="active">商品列表</button>
          <button type="button" data-nav="cart">
            购物车<span class="cart-badge" id="cart-badge" hidden>0</span>
          </button>
          <button type="button" data-nav="orders">我的订单</button>
        </nav>
        <a class="back-link" href="/page/">← 返回入口</a>
      </aside>

      <main class="custom-main">
        <section class="view active" data-view="products">
          <div class="custom-header">
            <h1>商品列表</h1>
          </div>
          <div id="product-list" class="product-list">
            <div class="empty-tip">加载中…</div>
          </div>
        </section>

        <section class="view" data-view="cart">
          <div class="custom-header">
            <h1>购物车</h1>
          </div>
          <div id="cart-list" class="cart-list">
            <div class="empty-tip">购物车为空</div>
          </div>
          <div class="cart-footer" id="cart-footer">
            <div class="cart-total">合计：¥<span id="cart-total">0.00</span></div>
            <button type="button" class="btn btn-primary" id="checkout-btn">提交订单</button>
          </div>
        </section>

        <section class="view" data-view="orders">
          <div class="custom-header">
            <h1>我的订单</h1>
          </div>
          <div id="order-list" class="order-list">
            <div class="empty-tip">加载中…</div>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-mask" id="modal-mask">
      <div class="modal" id="modal"></div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="/page/assets/custom.js"></script>
  </body>
</html>
